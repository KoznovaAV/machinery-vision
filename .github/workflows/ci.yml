name: MVP checks
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NO_ALBUMENTATIONS_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-hierarchy.txt
      - name: Release fingerprints
        run: python -B -m scripts.check_mvp_release
      - name: Tests without dataset or large weights
        run: python -B -m pytest tests -q -p no:cacheprovider
